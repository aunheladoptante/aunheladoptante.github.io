<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV | Aunhel John Adoptante</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-image: url('images/bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #0f172a;
        }
        .sidebar-clear { background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(20px) saturate(160%); border-right: 0.5px solid rgba(255, 255, 255, 0.2); }
        .content-card-clear { background: rgba(255, 255, 255, 0.22); backdrop-filter: blur(30px) saturate(150%); border: 1px solid rgba(255, 255, 255, 0.3); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.03); }
        .nav-pill-container { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.4); padding: 8px; border-radius: 9999px; display: inline-flex; gap: 12px; }
        .nav-link { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); color: #1e293b; letter-spacing: 0.35em; padding: 12px 28px; border-radius: 9999px; font-size: 11px; font-weight: 900; text-transform: uppercase; }
        .nav-link.active { color: #ffffff; background: #0369a1; box-shadow: 0 4px 15px rgba(3, 105, 161, 0.4); }
        .fade-in { animation: fadeIn 0.6s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Carousel Specific Styles */
        .carousel-view { position: relative; width: 100%; height: 100%; overflow: hidden; }
        .carousel-track { display: flex; transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1); height: 100%; width: 100%; }
        .nav-arrow {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4); color: #0f172a;
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; opacity: 0; transition: all 0.3s ease; z-index: 50;
        }
        .group:hover .nav-arrow { opacity: 1; }
        .nav-arrow:hover { background: white; transform: translateY(-50%) scale(1.1); }
    </style>
</head>
<body class="antialiased">
    <div class="flex flex-col lg:flex-row min-h-screen items-start">
        <aside id="section-header" class="w-full lg:w-[500px] sticky top-0 sidebar-clear px-8 py-12 min-h-screen flex flex-col items-center"></aside>
        <main class="flex-1 flex flex-col min-h-screen w-full">
            <div class="sticky top-0 z-30 p-10 flex justify-center">
                <nav class="nav-pill-container">
                    <button onclick="switchTab('professional')" id="btn-professional" class="nav-link active">Professional</button>
                    <button onclick="switchTab('passion')" id="btn-passion" class="nav-link">Passion</button>
                    <button onclick="switchTab('lifestyle')" id="btn-lifestyle" class="nav-link">Lifestyle</button>
                </nav>
            </div>
            <div class="p-6 lg:p-14 lg:pt-0">
                <div id="tab-content" class="content-card-clear rounded-[3rem] p-10 md:p-16 max-w-5xl mx-auto fade-in"></div>
            </div>
            <footer class="mt-auto p-12 text-center text-slate-500 font-bold text-[9px] uppercase tracking-[0.5em]">
                Aunhel John Adoptante • 2026
            </footer>
        </main>
    </div>

    <script>
        const carouselStates = {};

        async function hydrateCarousels() {
            try {
                const response = await fetch('data/gallery.json');
                const data = await response.json();
                document.querySelectorAll('.carousel-track').forEach(track => {
                    const id = track.id.replace('track-', '');
                    const images = data[id];
                    if (images) {
                        track.innerHTML = images.map(src => `
                            <div class="flex-shrink-0 w-full h-full">
                                <img src="${src}" class="w-full h-full object-cover">
                            </div>
                        `).join('');
                        carouselStates[id] = 0;
                        track.style.transform = `translateX(0%)`;
                    }
                });
            } catch (err) { console.error("Gallery initialization error:", err); }
        }

        window.moveSlide = function(id, dir) {
            const track = document.getElementById(`track-${id}`);
            if (!track) return;
            const slides = track.children.length;
            carouselStates[id] = (carouselStates[id] + dir + slides) % slides;
            track.style.transform = `translateX(-${carouselStates[id] * 100}%)`;
        };

        async function loadSection(file, containerId = 'tab-content') {
            try {
                const response = await fetch(`sections/${file}`);
                const content = await response.text();
                const container = document.getElementById(containerId);
                container.innerHTML = content;
                if (containerId === 'tab-content') await hydrateCarousels();
            } catch (err) { console.error("Section load error:", err); }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.nav-link').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${tabName}`).classList.add('active');
            loadSection(`${tabName}.html`);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadSection('header.html', 'section-header');
            switchTab('professional');
        });
    </script>
</body>
</html>
